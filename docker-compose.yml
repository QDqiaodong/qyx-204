services:
  mysql:
    image: ${DOCKER_REGISTRY}/mysql:8.0
    container_name: dormitory-mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      - --skip-log-bin
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - dormitory-network

  redis:
    image: ${DOCKER_REGISTRY}/redis:7-alpine
    container_name: dormitory-redis
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dormitory-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: dormitory-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - dormitory-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - DOCKER_REGISTRY=${DOCKER_REGISTRY}
    container_name: dormitory-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - dormitory-network

volumes:
  mysql_data:
  redis_data:

networks:
  dormitory-network:
    driver: bridge
